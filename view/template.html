<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bot telekil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Testuz edo irudiz betetzeko irudiak</h1>
    <p>Meme :3</p>
    <p style= "color: rebeccapurple">UwU</p>
    <div>
        <button onclick="window.location.href='index.html'">Atzera</button>
        <button id="new_template">Sortu template berria</button>
        <form id="template_form" hidden>
            <label >Irudia:</label>
            <input type="file" id="template_input" name="template_fitx">
            <label >Templatearen izena:</label>
            <input type="text" id="template_name" placeholder="Izena">
            <label >Textuaren Top Left izkina:</label>
            <input type="text" id="template_tl" placeholder="X,Y">
            <label >Textuaren Bottom Right izkina:</label>
            <input type="text" id="template_br" placeholder="X,Y">
            <label >Textuaren kolorea:</label>
            <input type="color" id="text_colour">
            <button type="submit">Botau</button>
        </form>
    </div>
    
    <div id="templates-panel">
        <h2>Templates disponibles</h2>
        <div id="templates"></div>
    </div>

</body>

<script>
    const token = localStorage.getItem("token-telekapp") || null;
    const apiUrl =  window.location.origin + "/TelekApp/";
document.getElementById("new_template").addEventListener("click", async function(event) {
    document.getElementById("template_form").toggleAttribute("hidden");
});

document.getElementById("template_form").addEventListener("submit",async function(event){
    event.preventDefault();
    const formData = new FormData();

    const file = document.getElementById("template_input").files[0];
    const template_name = document.getElementById("template_name").value;
    const coordinates_tl = document.getElementById("template_tl").value;
    const coordinates_br = document.getElementById("template_br").value;
    const colour = document.getElementById("text_colour").value;
    formData.append("template", file);
    formData.append("template_name", template_name);
    formData.append("coordinates_tl", coordinates_tl);
    formData.append("coordinates_br", coordinates_br);
    formData.append("text_colour",colour);
                
    try {
        const response = await fetch(apiUrl + "template", {
            method: "POST",
            headers: {
            "Authorization": `Bearer ${token}`
            },
            body: formData
        });

        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        const data = await response.json();
        console.log("Created combo from file:", data);
        document.getElementById('template_input').value = '';
        document.getElementById('template_name').value = '';
        document.getElementById('template_tl').value = '';
        document.getElementById('template_br').value = '';
        document.getElementById('text_colour').value = '';
        window.location.reload();

    } catch (error) {
        console.error("Error creating combo from file:", error);
    }
});


// Fetch and display templates
// The token is global here so we inherit it from index.html's context
// No need to add it to the function call! :)

async function getTemplates() {
    const list = document.getElementById("templates");

    try {
        const response = await fetch(apiUrl + "template", {
            headers: { "Authorization": `Bearer ${token}` }
        });

        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

        const data = await response.json();
        list.innerHTML = "";

        for (const tpl of data) {

        const card = document.createElement("div");
        card.className = "template-card";

        // ========= LEFT COLUMN =========
        const keyword = document.createElement("div");
        keyword.className = "template-keyword";
        keyword.innerText = tpl.template_command;

        // ========= CENTER COLUMN =========
        const imageContainer = document.createElement("div");
        imageContainer.className = "template-image";

        try {
            const imgResponse = await fetch(
                apiUrl + "template_image/" + encodeURIComponent(tpl.template_image_file),
                {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                }
            );

            if (imgResponse.ok) {
                const img = document.createElement("img");
                img.src = URL.createObjectURL(await imgResponse.blob());
                img.alt = tpl.template_image_file;
                img.style.maxWidth = "250px";

                imageContainer.appendChild(img);
            }
        } catch (e) {
            console.error("Error loading template image:", e);
        }

        // ========= RIGHT COLUMN =========
        const details = document.createElement("div");
        details.className = "template-details";

        const coords = document.createElement("p");
        coords.innerText =
            `(${tpl.text_box_tl_x}, ${tpl.text_box_tl_y}) → (${tpl.text_box_br_x}, ${tpl.text_box_br_y})`;

        const colourRow = document.createElement("p");

        const swatch = document.createElement("span");
        swatch.className = "colour-swatch";
        swatch.style.backgroundColor =
            "#" + tpl.default_text_colour.slice(0, 6);

        colourRow.appendChild(swatch);
        colourRow.appendChild(
            document.createTextNode(
                "#" + tpl.default_text_colour.slice(0, 6)
            )
        );

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.innerText = "💥 Suntsiketa 🗑️";

        deleteButton.addEventListener("click", async () => {

            if (!confirm(`⚠️ Oso suntsitzailea ⚠️\n${tpl.template_command} betiko ezabatu nahi duzu?`))
            {
                return;
            }

            try {
                const response = await fetch(
                    apiUrl + "template/delete",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            template_command: tpl.template_command
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                card.remove();

            } catch (error) {
                console.error(error);
                alert("Ba ezin izan dut 😔");
            }
        });

        details.appendChild(deleteButton);

        details.appendChild(coords);
        details.appendChild(colourRow);

        // ========= ASSEMBLE =========
        card.appendChild(keyword);
        card.appendChild(imageContainer);
        card.appendChild(details);

        list.appendChild(card);
    }} catch (error) {
        console.error("Error fetching templates:", error);
        list.innerHTML = "<li>Failed to load templates</li>";
    }
}

//To redirect everyone who isn't logged in back to the login page
async function checkLogin() {
    const token = localStorage.getItem("token-telekapp");

    if (!token) {
        window.location.href = "index.html";
        return false;
    }

    try {
        const response = await fetch(apiUrl + "check_token", {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });

        if (!response.ok) {
            localStorage.removeItem("token-telekapp");
            window.location.href = "index.html";
            return false;
        }

        return true;

    } catch (err) {
        console.error(err);
        window.location.href = "index.html";
        return false;
    }
}


(async () => {
    const loggedIn = await checkLogin();

    if (loggedIn) {
        getTemplates();
    }
})();

</script>
